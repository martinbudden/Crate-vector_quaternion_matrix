[package]
name = "vqm"
version = "0.1.9"
edition = "2024"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/martinbudden/crate-vector-quaternion-matrix"
description = "A vector, quaternion, and matrix library targeted at embedded systems and robotics."
keywords = ["vector", "quaternion", "matrix", "no_std", "robotics"]
categories = [
    "embedded",
    "mathematics",
    "no-std",
    "science::robotics",
]

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
rustc_version = "0.4.1"

[features]
default = ["libm",]
#default = ["libm", "serde"]
#default = ["std"]
#default = ["std", "serde"]
std = ["num-traits/std"]
libm = ["dep:libm", "num-traits/libm"]
serde = ["dep:serde", "postcard"]
no_align = []
simd = []

[dependencies]
# Marked optional so they aren't compiled unless requested
libm = { version = "0.2.16", optional = true } 
serde = { version = "1.0.228", default-features = false, features = ["derive"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["embedded-io"], optional = true }
derive_more = { version = "2.1.1", features = ["display"] }

# Mandatory dependencies
num-traits = { version = "0.2.19", default-features = false }
cfg-if = "1.0.4"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.1"
approx = { version = "0.5.1", default-features = false }

# see https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
opt-level = 0
debug = "line-tables-only"
# split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
debug = false
# split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'abort'
incremental = false
codegen-units = 16
rpath = false

[profile.release-lto]
inherits = "release"
lto = true

[[bench]]
name = "matrix_bench"
harness = false

[[bench]]
name = "vq_bench"
harness = false

[[bench]]
name = "math_bench"
harness = false
